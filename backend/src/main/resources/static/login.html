<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HotelManager · Acceso</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#10253d,#145d72);font:16px system-ui;color:#213448}.card{background:white;padding:44px;border-radius:20px;width:min(420px,92vw);box-shadow:0 24px 80px #0004}label{display:block;margin:18px 0 6px}input,button{width:100%;padding:13px;border-radius:8px;border:1px solid #bccbd6;font:inherit}button{margin-top:24px;background:#146d83;color:white;border:0;cursor:pointer}p{color:#586c7c}#message{color:#a22;min-height:24px}</style>
<section class="card"><h1>HotelManager</h1><p>Administración hotelera</p><form method="post" action="/login"><label for="username">Usuario</label><input id="username" name="username" autocomplete="username" required autofocus><label for="password">Contraseña</label><input id="password" type="password" name="password" autocomplete="current-password" required><input type="hidden" id="csrf"><button id="submit" disabled>Iniciar sesión</button></form><p id="message" role="alert"></p></section>
<script>const message=document.getElementById('message');if(location.search.includes('error'))message.textContent='Usuario o contraseña incorrectos.';if(location.search.includes('logout'))message.textContent='Sesión cerrada.';fetch('/api/csrf').then(r=>{if(!r.ok)throw Error();return r.json()}).then(t=>{const c=document.getElementById('csrf');c.name=t.parameterName;c.value=t.token;document.getElementById('submit').disabled=false}).catch(()=>message.textContent='No se pudo conectar. Recarga la página.');</script></html>
